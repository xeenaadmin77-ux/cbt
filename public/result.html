<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examination Result - ITI College CBT</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    @media print {
      .top-bar, .btn, .auth-footer-links {
        display: none !important;
      }
      body {
        background: white !important;
      }
      .auth-wrapper {
        min-height: auto;
        padding: 0;
      }
      .auth-card {
        border: none !important;
        box-shadow: none !important;
        max-width: 100% !important;
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="college-brand">
      <img src="images/xeena_logo.png" alt="XEENA Institute Logo" class="college-logo-img" />
      <div class="college-titles">
        <h1 class="college-name-display">XEENA INSTITUTE OF SKILL DEVELOPMENT</h1>
        <p class="lab-name-display">Examination Evaluation Portal</p>
      </div>
    </div>
    <a href="student-dashboard.html" class="btn btn-sm btn-secondary" style="background: rgba(255,255,255,0.15); color: #fff; border: none;">
      Dashboard
    </a>
  </header>

  <main class="auth-wrapper">
    <div id="resultContainer" style="width: 100%; max-width: 760px;">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        Loading examination scorecard...
      </div>
    </div>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
