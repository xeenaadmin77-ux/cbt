<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher & Invigilator Login - ITI College CBT</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <header class="top-bar">
    <div class="college-brand">
      <img src="images/xeena_logo.png" alt="XEENA Institute Logo" class="college-logo-img" />
      <div class="college-titles">
        <h1 class="college-name-display">XEENA INSTITUTE OF SKILL DEVELOPMENT</h1>
        <p class="lab-name-display">Faculty &amp; Invigilator Portal</p>
      </div>
    </div>
    <a href="index.html" class="btn btn-sm btn-secondary" style="background: rgba(255,255,255,0.15); color: #fff; border: none;">
      ← Home
    </a>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-icon" style="background: #f1f5f9; color: #0f172a;">👨‍🏫</div>
        <h2>Faculty Login</h2>
        <p>Examination Controller &amp; Invigilator Access</p>
      </div>

      <div class="auth-card-body">
        <div id="authAlert" class="alert alert-danger" style="display: none;"></div>

        <form id="teacherLoginForm" onsubmit="handleTeacherLogin(event)">
          <div class="form-group">
            <label class="form-label" for="teacherEmail">Faculty Email Address</label>
            <input 
              type="email" 
              id="teacherEmail" 
              class="form-control" 
              placeholder="faculty@xeena.edu" 
              required 
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="teacherPassword">Password</label>
            <input 
              type="password" 
              id="teacherPassword" 
              class="form-control" 
              placeholder="Enter secure faculty password" 
              required 
              autocomplete="current-password"
            />
          </div>

          <div class="auth-notice" style="background: #f8fafc;">
            <div class="auth-notice-icon">🛡️</div>
            <div>
              <strong>Security Protocol:</strong> Teacher accounts are pre-authorized by college administration.
            </div>
          </div>

          <button type="submit" id="teacherLoginBtn" class="btn btn-primary btn-lg" style="width: 100%;">
            Sign In to Faculty Portal
          </button>
        </form>

        <div class="auth-footer-links">
          <span>Are you an examinee? <a href="student-login.html">Student Login Portal</a></span>
        </div>
      </div>
    </div>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
