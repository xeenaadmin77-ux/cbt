<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question Manager - ITI College CBT</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/teacher.css" />
</head>
<body>
  <nav class="teacher-navbar">
    <div class="teacher-brand">
      <img src="images/xeena_logo.png" alt="XEENA Institute Logo" class="college-logo-img" style="width: 36px; height: 36px;" />
      <div>
        <h2 style="font-size: 15px; font-weight: 700; color: #ffffff; line-height: 1.2;">Faculty Portal</h2>
        <span class="college-name-display" style="font-size: 11px; color: #94a3b8;">XEENA INSTITUTE OF SKILL DEVELOPMENT</span>
      </div>
    </div>
    <ul class="teacher-nav-links">
      <li><a href="teacher-dashboard.html">📊 Overview</a></li>
      <li><a href="exam-create.html">➕ Create Exam</a></li>
      <li><a href="question-manager.html" class="active">❓ Question Bank</a></li>
      <li><a href="results.html">📈 Results</a></li>
      <li><a href="students-manager.html">👥 Students</a></li>
      <li><a href="settings.html">⚙️ Settings &amp; Audit</a></li>
    </ul>
    <div>
      <a href="teacher-dashboard.html" class="btn btn-sm btn-secondary" style="background: rgba(255,255,255,0.1); color: #fff; border: none;">← Dashboard</a>
    </div>
  </nav>

  <main class="teacher-wrapper">
    <!-- Exam Selector Bar -->
    <div class="data-table-card" style="padding: 16px 20px; margin-bottom: 24px;">
      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <label for="examSelector" style="font-weight: 700; font-size: 15px;">Target Examination:</label>
          <select id="examSelector" class="form-control" style="max-width: 450px; font-weight: 600;">
            <option value="">Loading examinations...</option>
          </select>
        </div>
        <div>
          <span id="totalQuestionsCountBadge" class="badge badge-primary" style="font-size: 14px; padding: 6px 14px;">
            0 Questions
          </span>
        </div>
      </div>
    </div>

    <!-- Question Creation Form Card (Section 17) -->
    <div class="form-card">
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--primary);">
        + Add Question to Examination
      </h2>

      <form id="addQuestionForm">
        <div class="form-group">
          <label class="form-label" for="questionText">Question Statement</label>
          <textarea 
            id="questionText" 
            class="form-control" 
            rows="3" 
            placeholder="Type the full question statement here..." 
            required
          ></textarea>
        </div>

        <!-- 4 Options Grid -->
        <div class="options-builder">
          <div class="option-input-wrap">
            <span class="option-tag-label">Option A:</span>
            <input 
              type="text" 
              id="optionA" 
              class="form-control" 
              placeholder="Choice A text" 
              required 
            />
          </div>

          <div class="option-input-wrap">
            <span class="option-tag-label">Option B:</span>
            <input 
              type="text" 
              id="optionB" 
              class="form-control" 
              placeholder="Choice B text" 
              required 
            />
          </div>

          <div class="option-input-wrap">
            <span class="option-tag-label">Option C:</span>
            <input 
              type="text" 
              id="optionC" 
              class="form-control" 
              placeholder="Choice C text" 
              required 
            />
          </div>

          <div class="option-input-wrap">
            <span class="option-tag-label">Option D:</span>
            <input 
              type="text" 
              id="optionD" 
              class="form-control" 
              placeholder="Choice D text" 
              required 
            />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px;">
          <div class="form-group">
            <label class="form-label" for="correctAnswer" style="color: var(--success); font-weight: 700;">
              ✓ Correct Answer (সঠিক উত্তর)
            </label>
            <select id="correctAnswer" class="form-control" style="font-weight: 700;" required>
              <option value="A">Option A</option>
              <option value="B">Option B</option>
              <option value="C">Option C</option>
              <option value="D">Option D</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="questionSet" style="color: var(--primary); font-weight: 700;">
              🏷️ Question Set (প্রশ্ন সেট)
            </label>
            <select id="questionSet" class="form-control" style="font-weight: 600;">
              <option value="Set A">Set A</option>
              <option value="Set B">Set B</option>
              <option value="Set C">Set C</option>
              <option value="Set D">Set D</option>
              <option value="Common Set">Common Set (All Candidates)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="questionMarks" style="font-weight: 700;">
              ⭐ Marks (প্রতি প্রশ্নের নম্বর)
            </label>
            <input 
              type="number" 
              id="questionMarks" 
              class="form-control" 
              value="2" 
              min="1" 
              max="50" 
              required 
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="timeLimitSeconds" style="color: #92400e; font-weight: 700;">
              ⏱️ Per-Question Timer (টাইমার)
            </label>
            <select id="timeLimitSeconds" class="form-control">
              <option value="0">0 - No Individual Timer (Total Exam Time)</option>
              <option value="30">30 Seconds (৩০ সেকেন্ড)</option>
              <option value="45">45 Seconds (৪৫ সেকেন্ড)</option>
              <option value="60" selected>60 Seconds (১ মিনিট)</option>
              <option value="90">90 Seconds (১.৫ মিনিট)</option>
              <option value="120">120 Seconds (২ মিনিট)</option>
            </select>
          </div>
        </div>

        <button type="submit" id="addQuestionBtn" class="btn btn-primary btn-lg">
          Add Question to Exam
        </button>
      </form>
    </div>

    <!-- Existing Questions List -->
    <div style="margin-top: 32px;">
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">
        Questions in Selected Exam
      </h2>
      <div id="questionListContainer">
        <!-- Rendered by teacher.js -->
      </div>
    </div>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/teacher.js"></script>
</body>
</html>
